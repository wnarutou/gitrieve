project_name: gitrieve
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    # 添加覆盖现有资产的配置
    override:
      - env:
          - CGO_ENABLED=0
        goos:
          - linux
          - windows
          - darwin
        ldflags: -s -w
        goarch:
          - amd64
        # 覆盖现有资产
        override_existing_assets: true
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
dockers:
  - image_templates:
      - wnarutou/gitrieve:{{ .Tag }}
      - wnarutou/gitrieve:latest
    dockerfile: Dockerfile.goreleaser
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
